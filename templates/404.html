{% extends 'base.html' %}

{% block title %}Page not found{% endblock title %}

{% block content %}
    <section class="bg-light py-10 text-center">
        <div class="container">
            <h1 class="fw-bold">404</h1>
            <h2>Oops! We couldn't find that page.</h2>
            <p class="mt-3 mb-5">The page you're looking for doesn't exist or has been moved.</p>
            <a class="btn fw-500 ms-lg-4 btn-primary px-10" href="{% url 'index' %}">Back to home</a>
        </div>
    </section>
{% endblock %}
