name: CI Pipeline

on:
  # Trigger on every push to any branch
  push: {}

jobs:
  # Job 1: build-test — runs on every branch
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run flake8 and pytest
        run: |
          flake8
          pytest --cov --cov-report=xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 1

  # Job 2: dockerize — runs only if tests pass AND on master
  dockerize:
    runs-on: ubuntu-latest
    needs: build-test  # waits for build-test success
    if: github.ref == 'refs/heads/master'  # master only
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and tag image
        run: |
          SHORT_HASH=$(git rev-parse --short HEAD)
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/oc-lettings:$SHORT_HASH .
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/oc-lettings:$SHORT_HASH ${{ secrets.DOCKERHUB_USERNAME }}/oc-lettings:latest

      - name: Push to Docker Hub
        run: |
          SHORT_HASH=$(git rev-parse --short HEAD)
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/oc-lettings:$SHORT_HASH
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/oc-lettings:latest

  # Job 3: deploy — placeholder, skeleton only
  # TODO: replace RENDER_DEPLOY_HOOK_URL with actual Render URL in W4-T4
  deploy:
    runs-on: ubuntu-latest
    needs: dockerize  # waits for dockerize success
    if: github.ref == 'refs/heads/master'  # master only
    steps:
      - name: Deploy to Render
        run: |
          echo "Deploy triggered on master after successful dockerize"
